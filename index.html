<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codespace Field Trip</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(#8fd3ff,#e6f7ff);color:#123;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;background:#fff8;font-size:15px}
h1{font-size:18px;margin:0}#hud{display:flex;flex-wrap:wrap;gap:6px}button{font:inherit;padding:8px 14px;border-radius:20px;border:2px solid #246;background:#fff;cursor:pointer}
#sky{position:relative;flex:1;min-height:0}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.85}
#bus{position:absolute;top:30%;left:-160px;font-size:54px;transition:transform .2s}#bus.honk{transform:scale(1.25) rotate(-6deg)}
#honk{position:absolute;font-weight:bold;color:#c33;display:none}
#tree{position:absolute;right:8%;bottom:12%;font-size:clamp(80px,22vw,110px)}
#crew{position:absolute;left:8px;right:8px;bottom:2%;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;pointer-events:none}
.kid{font-size:14px;background:#fff;border-radius:10px;padding:3px 6px;opacity:0;transition:opacity .6s}
.leaf{position:absolute;font-size:22px;pointer-events:none}
#msg{position:absolute;left:0;right:0;top:12%;text-align:center;font-size:16px;padding:0 10px}
</style></head><body>
<header><h1>☁️ Codespace Field Trip</h1><div id="hud"><button id="start">▶ Start</button><button id="honkBtn" disabled>📯 Honk (H)</button><span id="score">Leaves: 0</span></div></header>
<div id="sky"><div id="msg">Press Start to send the cloud bus on its trip.<br>Then tap, click, Space or H to honk and shake leaves loose.</div>
<div id="bus" aria-label="cloud bus">🚌☁️</div><div id="honk">HONK!</div><div id="tree">🌳</div></div>
<script>
const sky=document.getElementById('sky'),bus=document.getElementById('bus'),honkEl=document.getElementById('honk'),tree=document.getElementById('tree'),msg=document.getElementById('msg'),score=document.getElementById('score'),hb=document.getElementById('honkBtn');
let started=false,x=-160,leaves=0,dropped=0,last=0;
const crew=['Root 📜','Branch 🌿','Tide 🌊','589 💛'];
for(let i=0;i<5;i++){const c=document.createElement('div');c.className='cloud';c.style.cssText=`width:${60+i*15}px;height:${25+i*4}px;top:${8+i*14}%;left:${(i*23)%90}%`;sky.appendChild(c)}
const row=document.createElement('div');row.id='crew';sky.appendChild(row);
const kids=crew.map(n=>{const k=document.createElement('div');k.className='kid';k.textContent=n;row.appendChild(k);return k});
function honk(){if(!started)return;bus.classList.add('honk');honkEl.style.display='block';honkEl.style.left=(x+60)+'px';honkEl.style.top=(bus.offsetTop-20)+'px';setTimeout(()=>{bus.classList.remove('honk');honkEl.style.display='none'},250);for(let i=0;i<3;i++)leaf()}
function leaf(){const l=document.createElement('div');l.className='leaf';l.textContent=['🍃','🍂','🍁'][Math.random()*3|0];const r=tree.getBoundingClientRect(),s=sky.getBoundingClientRect();let lx=r.left-s.left+Math.random()*r.width,ly=r.top-s.top+20,vx=(Math.random()-.5)*1.5;l.style.left=lx+'px';l.style.top=ly+'px';sky.appendChild(l);leaves++;score.textContent='Leaves: '+leaves;
(function f(){ly+=1.6;lx+=vx+Math.sin(ly/15);l.style.left=lx+'px';l.style.top=ly+'px';if(ly<s.height-10)requestAnimationFrame(f);else l.remove()})()}
function loop(t){const dt=Math.min(50,t-(last||t));last=t;const stop=tree.offsetLeft-130;if(x<stop){x+=dt*.12;bus.style.left=x+'px';const p=(x+160)/(stop+160);while(dropped<4&&p>(dropped+1)/4.2){kids[dropped].style.opacity=1;dropped++}}else if(dropped<4){kids.forEach(k=>k.style.opacity=1);dropped=4}else msg.textContent='Everyone made it to the tree! Keep honking for leaves 🍃';requestAnimationFrame(loop)}
document.getElementById('start').onclick=e=>{e.stopPropagation();if(started)return;started=true;hb.disabled=false;e.target.textContent='🚌 On the way';msg.textContent='Off we go!';requestAnimationFrame(loop)};
hb.onclick=e=>{e.stopPropagation();honk()};
sky.addEventListener('pointerdown',honk);
addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H'||e.key===' '){e.preventDefault();honk()}else if(e.key==='Enter'&&!started)document.getElementById('start').click()});
</script></body></html>
